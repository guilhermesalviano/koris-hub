name = "koris-hub"
main = "worker/src/index.ts"
compatibility_date = "2026-01-01"

routes = [{ pattern = "imkoris.com", custom_domain = true }]

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[observability]
enabled = true

