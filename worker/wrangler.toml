name = "koris-hub-ask"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# The public proxy the FAQ widget calls. `custom_domain` creates/manages the
# DNS record for the subdomain, so the Worker is reachable at
# https://api.hub.koaris.com/ask.
routes = [{ pattern = "api.hub.koaris.com", custom_domain = true }]

[observability]
enabled = true
